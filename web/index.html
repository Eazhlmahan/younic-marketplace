<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Younic — creator marketplace</title>
<style>
  :root{
    --ink:#14181a;
    --ink-2:#1c2225;
    --ink-3:#252c2f;
    --line:#323a3d;
    --line-soft:#2a3134;
    --text:#eef1f0;
    --text-dim:#9aa5a3;
    --text-mute:#6c7674;
    --trust:#3ecf8e;
    --trust-dim:#1f5c42;
    --trust-bg:#16261f;
    --amber:#e3a13a;
    --amber-bg:#2a2318;
    --coral:#e2604f;
    --coral-bg:#2a1a17;
    --radius:10px;
    --serif:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    --mono:'SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--ink);color:var(--text);font-family:var(--sans);min-height:100vh;}
  body{-webkit-font-smoothing:antialiased;}
  #app{max-width:1100px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- mobile app shell ---------- */
  #shell-outer{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;background:radial-gradient(ellipse at top,#1a2022,var(--ink) 60%);}
  #phone{width:390px;max-width:100%;background:var(--ink);border:10px solid #0a0d0e;border-radius:40px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.5);position:relative;}
  #phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:22px;background:#0a0d0e;border-radius:0 0 14px 14px;z-index:5;}
  #phone-screen{height:780px;overflow-y:auto;padding:34px 18px 18px;position:relative;}
  #phone-screen::-webkit-scrollbar{width:0;}
  .bottom-nav{position:sticky;bottom:0;left:0;right:0;background:var(--ink-2);border-top:1px solid var(--line-soft);display:flex;padding:10px 6px 8px;margin:0 -18px -18px;}
  .nav-item{flex:1;text-align:center;font-size:10px;color:var(--text-mute);cursor:pointer;}
  .nav-item .ico{font-size:18px;display:block;margin-bottom:2px;}
  .nav-item.active{color:var(--trust);}

  /* ---------- auth screens ---------- */
  .auth-wrap{padding-top:30px;}
  .auth-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:34px;}
  .auth-logo .logo-mark{width:44px;height:44px;margin-bottom:10px;}
  .auth-logo .logo-text{font-size:24px;}
  .segctrl{display:flex;background:var(--ink-3);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:22px;}
  .segctrl div{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;color:var(--text-dim);cursor:pointer;}
  .segctrl div.active{background:var(--trust);color:#0c1a13;font-weight:600;}
  .otp-row{display:flex;gap:8px;justify-content:center;margin-bottom:18px;}
  .otp-box{width:42px;height:50px;text-align:center;font-size:20px;font-family:var(--mono);}
  .verify-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
  .verify-dot{width:24px;height:24px;border-radius:50%;background:var(--ink-3);border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-mute);}
  .verify-dot.done{background:var(--trust);border-color:var(--trust);color:#0c1a13;}
  .verify-text{flex:1;}
  .verify-text .t{font-size:13px;}
  .verify-text .s{font-size:11px;color:var(--text-mute);}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line-soft);margin-bottom:28px;}
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .logo-mark{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--trust),var(--trust-dim),var(--trust));display:flex;align-items:center;justify-content:center;}
  .logo-mark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);}
  .logo-text{font-family:var(--serif);font-size:19px;letter-spacing:0.3px;}
  .nav-right{display:flex;align-items:center;gap:16px;}
  .role-pill{font-size:12px;padding:5px 12px;border-radius:20px;background:var(--ink-3);border:1px solid var(--line);color:var(--text-dim);cursor:pointer;}
  .role-pill.active{background:var(--trust-bg);border-color:var(--trust-dim);color:var(--trust);}

  /* ---------- generic ---------- */
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--trust);margin-bottom:8px;}
  h1{font-family:var(--serif);font-size:32px;font-weight:400;line-height:1.2;margin-bottom:6px;}
  h2{font-family:var(--serif);font-size:22px;font-weight:400;margin-bottom:4px;}
  .sub{color:var(--text-dim);font-size:14px;margin-bottom:24px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border-radius:var(--radius);border:1px solid var(--line);background:var(--ink-3);color:var(--text);font-size:14px;cursor:pointer;transition:all .15s ease;font-family:var(--sans);}
  .btn:hover{border-color:var(--text-mute);}
  .btn-primary{background:var(--trust);border-color:var(--trust);color:#0c1a13;font-weight:600;}
  .btn-primary:hover{background:#4fdb9d;}
  .btn-ghost{background:transparent;}
  .btn-block{width:100%;}
  .btn-sm{height:32px;padding:0 12px;font-size:13px;}
  select,input,textarea{background:var(--ink-3);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;font-family:var(--sans);}
  textarea{resize:vertical;min-height:70px;width:100%;}
  input,select{width:100%;}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field{margin-bottom:14px;}

  /* ---------- filters ---------- */
  .filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}

  /* ---------- creator cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .card{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s ease,transform .15s ease;}
  .card:hover{border-color:var(--trust-dim);transform:translateY(-1px);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .anon-id{font-family:var(--mono);font-size:14px;color:var(--text);}
  .tier-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-family:var(--mono);letter-spacing:0.4px;text-transform:uppercase;}
  .tier-pro{background:var(--trust-bg);color:var(--trust);border:1px solid var(--trust-dim);}
  .tier-established{background:var(--amber-bg);color:var(--amber);border:1px solid #6b5122;}
  .tier-verified{background:var(--ink-3);color:var(--text-dim);border:1px solid var(--line);}
  .niche{font-size:13px;color:var(--text-dim);margin-bottom:14px;}
  .stat-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-mute);border-top:1px solid var(--line-soft);padding-top:10px;}
  .stat-row b{color:var(--text);font-weight:500;}

  /* ---------- profile ---------- */
  .profile-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
  .stat-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .stat-box{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;text-align:center;}
  .stat-box .num{font-family:var(--serif);font-size:24px;color:var(--trust);}
  .stat-box .lbl{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
  .port-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .port-item{aspect-ratio:1;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-mute);font-size:11px;}
  .deal-row{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line-soft);color:var(--text-dim);}
  .deal-row span.rating{color:var(--amber);}

  /* ---------- back link ---------- */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:20px;cursor:pointer;}
  .back:hover{color:var(--text);}

  /* ---------- panel / summary card ---------- */
  .panel{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .panel-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--text-dim);}
  .panel-row b{color:var(--text);font-weight:500;}
  .panel-row.total{border-top:1px solid var(--line-soft);margin-top:6px;padding-top:10px;font-size:14px;}
  .panel-row.total b{color:var(--trust);}
  .notice{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text-dim);background:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:16px;}
  .notice.locked{background:var(--coral-bg);border-color:#6b2e24;color:#e8a99e;}
  .notice.unlocked{background:var(--trust-bg);border-color:var(--trust-dim);color:var(--trust);}
  .status-pill{font-size:11px;padding:4px 10px;border-radius:20px;font-family:var(--mono);letter-spacing:0.4px;}

  /* ---------- negotiation thread ---------- */
  .thread{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .bubble{max-width:78%;padding:9px 13px;border-radius:12px;font-size:13px;}
  .bubble.me{align-self:flex-end;background:var(--trust-bg);border:1px solid var(--trust-dim);color:var(--trust);border-bottom-right-radius:3px;}
  .bubble.them{align-self:flex-start;background:var(--ink-3);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:3px;}

  /* ---------- stepper ---------- */
  .stepper{display:flex;align-items:center;margin-bottom:28px;overflow-x:auto;padding-bottom:4px;}
  .step{display:flex;align-items:center;flex-shrink:0;}
  .step-dot{width:22px;height:22px;border-radius:50%;background:var(--ink-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--mono);color:var(--text-mute);flex-shrink:0;}
  .step-dot.done{background:var(--trust);border-color:var(--trust);color:#0c1a13;}
  .step-dot.current{border-color:var(--trust);color:var(--trust);}
  .step-label{font-size:11px;color:var(--text-mute);margin:0 6px;white-space:nowrap;}
  .step-label.done,.step-label.current{color:var(--text-dim);}
  .step-line{width:24px;height:1px;background:var(--line);flex-shrink:0;}
  .step-line.done{background:var(--trust-dim);}

  /* ---------- toast ---------- */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-3);border:1px solid var(--trust-dim);color:var(--trust);padding:12px 20px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:100;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:640px){
    h1{font-size:26px;}
    .stat-boxes,.port-grid{grid-template-columns:repeat(3,1fr);}
    .grid{grid-template-columns:1fr;}
    .filters{flex-direction:column;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ===================== API CLIENT ===================== */
const API_BASE = window.YOUNIC_API_BASE || "";
let AUTH_TOKEN = localStorage.getItem('younic_token') || null;

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (AUTH_TOKEN) headers['Authorization'] = 'Bearer ' + AUTH_TOKEN;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function setToken(t){ AUTH_TOKEN = t; if(t) localStorage.setItem('younic_token', t); else localStorage.removeItem('younic_token'); }

/* ===================== STATE ===================== */
let state = {
  screen: AUTH_TOKEN ? "browse" : "splash",
  authRole: "business",
  currentUser: null,
  phone: "",
  otp: ["","","",""],
  creators: [],
  selectedCreator: null, // full creator detail object from API
  booking: null,         // { id, ...booking row from API, offers: [] }
  bookingsList: [],
  chatBooking: null,
  contact: null,
  myProfile: null,
  ratingGiven: 0,
};

const NAV_ITEMS = [
  {id:"browse", ico:"◎", label:"Browse"},
  {id:"bookings-tab", ico:"▤", label:"Bookings"},
  {id:"messages-tab", ico:"◐", label:"Messages"},
  {id:"account-tab", ico:"●", label:"Account"},
];

/* ===================== HELPERS ===================== */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function nav(screen, payload){
  state.screen = screen;
  if(payload) Object.assign(state, payload);
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function fmtINR(n){ return "₹" + Number(n||0).toLocaleString('en-IN'); }
async function safe(fn){
  try { await fn(); } catch(e){ toast(e.message || 'Something went wrong'); }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isBusiness(){ return state.currentUser && state.currentUser.role === 'business'; }
function isCreator(){ return state.currentUser && state.currentUser.role === 'creator'; }
function counterpartyInfo(){
  const b = state.booking, me = state.currentUser;
  if(!b || !me) return null;
  const biz = me.id === b.business_id;
  return {
    anon: biz ? (b.creator_anon || 'Creator') : (b.business_anon || 'Business'),
    name: biz ? (b.creator_name || '') : (b.business_name || ''),
    handle: biz ? (b.creator_handle || '') : '',
    verified_url: biz ? (b.creator_verified_url || '') : '',
  };
}
function counterparty(){
  const info = counterpartyInfo();
  return info ? (info.name || info.anon) : null;
}
function partyLabel(){
  const info = counterpartyInfo();
  if(!info) return '';
  const handle = info.handle ? ` <span style="color:var(--trust);font-size:12px;">${esc(info.handle)}</span>` : '';
  return esc(info.name || info.anon) + handle;
}
function bookingPartyLabel(b){
  const name = b.counterparty_name || b.counterparty_anon || 'Deal';
  const handle = b.counterparty_handle ? ` <span style="color:var(--trust);font-size:11px;">${esc(b.counterparty_handle)}</span>` : '';
  return esc(name) + handle;
}
function statusMeta(s){
  const m = { negotiating:['Negotiating','amber'], confirmed:['Confirmed','amber'], identity_unlocked:['Escrow held','trust'], delivered:['Delivered','trust'], paid_out:['Paid out','trust'], disputed:['Disputed','coral'], refunded:['Withdrawn','mute'] };
  return m[s] || [s, 'mute'];
}
function pill(s){
  const [label, kind] = statusMeta(s);
  const bg = {amber:'var(--amber-bg)', trust:'var(--trust-bg)', coral:'var(--coral-bg)', mute:'var(--ink-3)'}[kind];
  const fg = {amber:'var(--amber)', trust:'var(--trust)', coral:'var(--coral)', mute:'var(--text-mute)'}[kind];
  const bd = {amber:'#6b5122', trust:'var(--trust-dim)', coral:'#6b2e24', mute:'var(--line)'}[kind];
  return `<span class="status-pill" style="background:${bg};color:${fg};border:1px solid ${bd};">${label}</span>`;
}

/* ===================== STEPPER ===================== */
const FLOW_STEPS = ["Browse","Profile","Request","Negotiate","Escrow","Deliver","Payout"];
function stepIndexForScreen(s){
  return {browse:0, profile:1, request:2, negotiate:3, escrow:4, deliver:5, payout:6}[s] ?? -1;
}
const AUTH_SCREENS = ['splash','signup','login','otp','verify'];
function renderStepper(){
  const current = stepIndexForScreen(state.screen);
  let html = '<div class="stepper">';
  FLOW_STEPS.forEach((label,i)=>{
    const cls = i < current ? 'done' : (i === current ? 'current' : '');
    html += `<div class="step"><div class="step-dot ${cls}">${i<current?'✓':i+1}</div><span class="step-label ${cls}">${label}</span></div>`;
    if(i < FLOW_STEPS.length-1) html += `<div class="step-line ${i<current?'done':''}"></div>`;
  });
  html += '</div>';
  return html;
}

/* ===================== AUTH SCREENS ===================== */
function screenSplash(){
  return `
    <div class="auth-wrap" style="text-align:center;padding-top:120px;">
      <div class="auth-logo"><div class="logo-mark"></div><div class="logo-text">Younic</div></div>
      <div class="sub" style="margin-bottom:40px;">Verified creator-brand marketplace</div>
      <button class="btn btn-primary btn-block" style="margin-bottom:10px;" onclick="nav('signup')">Create account</button>
      <button class="btn btn-block" onclick="nav('login')">Log in</button>
      <div class="sub" style="margin-top:16px;font-size:11px;">API: ${API_BASE}</div>
    </div>
  `;
}

function screenSignup(){
  return `
    <div class="auth-wrap">
      <div class="auth-logo"><div class="logo-mark"></div><div class="logo-text">Younic</div></div>
      <div class="segctrl">
        <div class="${state.authRole==='business'?'active':''}" onclick="setAuthRole('business')">I'm a business</div>
        <div class="${state.authRole==='creator'?'active':''}" onclick="setAuthRole('creator')">I'm a creator</div>
      </div>
      <div class="field"><label>${state.authRole==='business'?'Business name':'Full name'}</label><input id="su-name" type="text" placeholder="Enter name"></div>
      <div class="field"><label>Email</label><input id="su-email" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>Mobile number (optional)</label><input id="su-phone" type="text" placeholder="+91 98765 43210"></div>
      <div class="field"><label>Password</label><input id="su-password" type="password" placeholder="Create a password"></div>
      <button class="btn btn-primary btn-block" style="margin-top:6px;" onclick="doSignup()">Continue</button>
      <div class="sub" style="text-align:center;margin-top:14px;">Already have an account? <span style="color:var(--trust);cursor:pointer;" onclick="nav('login')">Log in</span></div>
    </div>
  `;
}

function screenLogin(){
  return `
    <div class="auth-wrap">
      <div class="auth-logo"><div class="logo-mark"></div><div class="logo-text">Younic</div></div>
      <div class="field"><label>Email</label><input id="li-email" type="text" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input id="li-password" type="password" placeholder="Enter password"></div>
      <button class="btn btn-primary btn-block" style="margin-top:6px;" onclick="doLogin()">Log in</button>
      <div class="sub" style="text-align:center;margin-top:14px;">New here? <span style="color:var(--trust);cursor:pointer;" onclick="nav('signup')">Create account</span></div>
      <div class="sub" style="text-align:center;margin-top:6px;font-size:11px;">Seeded creators use password: password123</div>
    </div>
  `;
}

function screenOtp(){
  const channel = state.otpChannel || 'email';
  const target = channel === 'phone' ? (state.phone || 'your number') : (state.currentUser && state.currentUser.email);
  const boxes = state.otp.map((v,i)=>`<input class="otp-box" maxlength="1" value="${v}" oninput="otpInput(${i},this.value)" id="otp-${i}">`).join('');
  return `
    <div class="auth-wrap">
      <div class="eyebrow" style="text-align:center;">${channel==='phone'?'Optional verification':'Account verification'}</div>
      <h2 style="text-align:center;margin-bottom:6px;">Verify your ${channel==='phone'?'number':'email'}</h2>
      <div class="sub" style="text-align:center;">Code sent to ${target}. Check the server console log (dev mode).</div>
      <div class="otp-row" style="margin-top:20px;">${boxes}</div>
      <button class="btn btn-primary btn-block" onclick="verifyOtp()">Verify</button>
      <div class="sub" style="text-align:center;margin-top:12px;cursor:pointer;" onclick="safe(()=>sendOtp(channel))">Resend code</div>
    </div>
  `;
}

function screenVerify(){
  const u = state.currentUser || {};
  return `
    <div class="eyebrow">Almost there</div>
    <h2 style="margin-bottom:4px;">Verify your email</h2>
    <div class="sub">Confirming your email is real and reachable completes your verification. It only takes a minute.</div>
    <div class="verify-item"><div class="verify-dot ${u.email_verified?'done':''}">${u.email_verified?'✓':''}</div><div class="verify-text"><div class="t">Email address</div><div class="s">${u.email_verified?'Verified':'Required'}</div></div>
      ${!u.email_verified ? `<button class="btn btn-sm" onclick="safe(async()=>{await sendOtp('email'); nav('otp',{otpChannel:'email', otp:['','','','']});})">Verify</button>` : ''}
    </div>
    <div class="verify-item"><div class="verify-dot">—</div><div class="verify-text"><div class="t">Phone (optional, not verified)</div><div class="s">Not required for verification</div></div></div>
    <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="nav('browse')">${u.email_verified? 'Continue to app' : 'Skip for now'}</button>
  `;
}

/* auth actions — real API calls */
function setAuthRole(r){ state.authRole = r; render(); }

async function doSignup(){
  const name = document.getElementById('su-name').value;
  const email = document.getElementById('su-email').value;
  const phone = document.getElementById('su-phone').value;
  const password = document.getElementById('su-password').value;
  if(!email || !password) return toast('Email and password required');
  await safe(async ()=>{
    const data = await api('/auth/signup', { method:'POST', body: JSON.stringify({ role: state.authRole, name, email, phone, password }) });
    setToken(data.token);
    state.currentUser = data.user;
    state.phone = phone;
    toast('Account created');
    await safe(()=>sendOtp('email'));
    nav('otp', { otpChannel:'email', otp:['','','',''] });

/* ===================== NEGOTIATE ===================== */
async function refreshBooking(id){
  const data = await api('/bookings/'+id);
  state.booking = { ...data.booking, offers: data.offers, identity_unlocked: data.identity_unlocked };
}

function screenNegotiate(){
  const b = state.booking;
  const other = counterparty() || 'Creator';
  const meRole = isBusiness() ? 'business' : 'creator';
  const bubbles = (b.offers||[]).map(r => {
    const mine = r.offered_by === meRole;
    return `<div class="bubble ${mine?'me':'them'}">${mine?'You':esc(other)} ${r.round===1?'offered':'countered'} ${fmtINR(r.price)} &middot; ${r.timeline_days} days</div>`;
  }).join('');
  const roundNum = (b.offers||[]).length;
  const capReached = roundNum >= 3;
  return `
    <div class="back" onclick="nav('booking-detail')">&larr; booking</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <h1 style="font-size:24px;">Negotiating</h1>
      ${pill(b.status)}
    </div>
    <div class="sub">with ${partyLabel()} &middot; contact stays private</div>
    <div class="thread">${bubbles || `<div class="sub">No offers yet.</div>`}</div>
    <div class="notice">${capReached ? "Round limit reached — accept the latest offer or withdraw." : "Up to "+(3-roundNum)+" more round(s). After round 3, accept or the request expires."}</div>
    ${capReached ? '' : `
      <div class="field"><label>Counter price</label><input id="neg-price" type="text" value="${b.agreed_price - 500}"></div>
      <div class="field"><label>Counter timeline (days)</label><input id="neg-days" type="text" value="7"></div>
    `}
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1;" onclick="acceptOffer()">Accept ${fmtINR(b.agreed_price)}</button>
      ${capReached ? '' : `<button class="btn" style="flex:1;" onclick="counterOffer()">Send counter</button>`}
      <button class="btn btn-ghost" style="flex:1;" onclick="withdrawRequest()">Withdraw</button>
    </div>
  `;
}

async function counterOffer(){
  const price = parseInt(document.getElementById('neg-price').value);
  const days = parseInt(document.getElementById('neg-days').value);
  await safe(async ()=>{
    await api('/bookings/'+state.booking.id+'/counter', { method:'POST', body: JSON.stringify({ price, timeline_days: days }) });
    await refreshBooking(state.booking.id);
    render();
    toast('Counter sent');
  });
}
async function acceptOffer(){
  await safe(async ()=>{
    await api('/bookings/'+state.booking.id+'/accept', { method:'POST' });
    await refreshBooking(state.booking.id);
    toast('Offer accepted');
    if(isBusiness()) nav('escrow'); else nav('booking-detail');
  });
}
async function withdrawRequest(){
  await safe(async ()=>{
    await api('/bookings/'+state.booking.id+'/withdraw', { method:'POST' });
    toast('Request withdrawn');
    await loadMyBookings();
    nav('bookings-tab');
  });
}

/* ===================== ESCROW / DELIVER / PAYOUT ===================== */
function screenEscrow(){
  const b = state.booking;
  const other = counterparty() || 'creator';
  const commission = Math.round(b.agreed_price * 0.15);
  const creatorGets = b.agreed_price - commission;
  return `
    <div class="eyebrow">Confirm and pay</div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h1 style="font-size:24px;">Escrow payment</h1>
      ${pill(b.status)}
    </div>
    <div class="sub">${esc(other)} accepted your booking</div>
    <div class="panel">
      <div class="panel-row"><span>Deliverable</span><b>${esc(b.deliverable)}</b></div>
      <div class="panel-row"><span>Delivery by</span><b>${esc(b.deadline)} days</b></div>
      <div class="panel-row"><span>Agreed price</span><b>${fmtINR(b.agreed_price)}</b></div>
    </div>
    <div class="panel">
      <div class="panel-row"><span>Held in escrow</span><b>${fmtINR(b.agreed_price)}</b></div>
      <div class="panel-row"><span>Platform commission (15%)</span><b>-${fmtINR(commission)}</b></div>
      <div class="panel-row total"><span>Creator receives on approval</span><b>${fmtINR(creatorGets)}</b></div>
    </div>
    <div class="notice">🔒 Contact details stay private — all communication and payment happens here, not on WhatsApp/Instagram DMs.</div>
    <button class="btn btn-primary btn-block" onclick="payEscrow()">Pay ${fmtINR(b.agreed_price)} into escrow</button>
  `;
}

async function payEscrow(){
  await safe(async ()=>{
    await api('/bookings/'+state.booking.id+'/escrow/pay', { method:'POST' });
    await refreshBooking(state.booking.id);
    toast('Payment held in escrow (simulated)');
    nav('deliver');
  });
}

function screenDeliver(){
  const b = state.booking;
  const other = partyLabel();
  const creatorDelivered = ['delivered','approved','paid_out'].includes(b.status);
  let action = '';
  if(isCreator() && b.status === 'identity_unlocked'){
    action = `
      <div class="field"><label>Deliverable file URL</label><input id="dl-url" type="text" placeholder="https://.../final-reel.mp4"></div>
      <button class="btn btn-primary btn-block" onclick="uploadDeliverable()">Upload deliverable</button>`;
  } else if(isCreator() && creatorDelivered){
    action = `<div class="notice unlocked">✓ Delivered — waiting for ${esc(other)} to approve and release payout.</div>`;
  } else if(isBusiness() && b.status === 'delivered'){
    action = `<button class="btn btn-primary btn-block" onclick="nav('payout')">Review and approve</button>`;
  } else if(isBusiness()){
    action = `<div class="notice">⏳ Waiting for ${esc(other)} to upload content.</div>`;
  }
  return `
    <div class="eyebrow">Deal progress</div>
    <h1 style="font-size:24px;">Delivery</h1>
    <div class="sub">${partyLabel()} ${isBusiness()?'is preparing your content':'is working on this booking'}</div>
    <div class="panel">
      <div class="panel-row"><span>Deliverable</span><b>${esc(b.deliverable)}</b></div>
      <div class="panel-row"><span>Status</span><b>${pill(b.status)}</b></div>
    </div>
    <div class="notice">🔒 Contact details stay private — all communication and payment happens here, not on WhatsApp/Instagram DMs.</div>
    ${action}
    <button class="btn btn-block" style="margin-top:10px;" onclick="revealContact()">View verified identity</button>
    <div id="contact-box"></div>
  `;
}

async function uploadDeliverable(){
  const url = (document.getElementById('dl-url')||{}).value;
  if(!url) return toast('Paste a file URL first');
  await safe(async ()=>{
    await api('/bookings/'+state.booking.id+'/deliverables', { method:'POST', body: JSON.stringify({ file_url: url }) });
    await refreshBooking(state.booking.id);
    toast('Content delivered');
    render();
  });
}

async function revealContact(){
  await safe(async ()=>{
    const data = await api('/bookings/'+state.booking.id+'/reveal');
    const box = document.getElementById('contact-box');
    if(box) box.innerHTML = `
      <div class="panel" style="margin-top:10px;background:var(--trust-bg);border-color:var(--trust-dim);">

        <div class="notice" style="margin-top:8px;padding:8px 10px;">Phone and email stay private — message ${esc(data.name || 'them')} here instead.</div>
      </div>`;
  });
}

function screenPayout(){
  const b = state.booking;
  const other = counterparty() || 'creator';
  const commission = Math.round(b.agreed_price * 0.15);
  const creatorGets = b.agreed_price - commission;
  const isPaid = b.status === 'paid_out';
  const businessCanApprove = isBusiness() && b.status === 'delivered';
  return `
    <div class="eyebrow">Deal status: ${b.status}</div>
    <h1 style="font-size:24px;">${isPaid ? 'Deal complete' : (businessCanApprove ? 'Approve content' : 'Payout')}</h1>
    <div class="sub">${esc(other)}</div>
    <div class="panel">
      <div class="panel-row"><span>Amount to release</span><b>${fmtINR(creatorGets)}</b></div>
      <div class="panel-row"><span>Younic commission</span><b>${fmtINR(commission)}</b></div>
    </div>
    ${businessCanApprove ? `<button class="btn btn-primary btn-block" onclick="approveAndPay()">Approve and release payout</button>` : ''}
    ${isBusiness() && b.status !== 'delivered' && b.status !== 'paid_out' ? `<button class="btn btn-block" onclick="nav('deliver')">Back to delivery</button>` : ''}
    ${isPaid ? `
    <div class="field" style="margin-top:14px;"><label>Rate this ${isBusiness()?'creator':'business'}</label>
      <div style="display:flex;gap:6px;margin-bottom:10px;">
        ${[1,2,3,4,5].map(n=>`<span style="cursor:pointer;font-size:22px;color:var(--amber);" onclick="rate(${n})">${n<=(state.ratingGiven||0)?'★':'☆'}</span>`).join('')}
      </div>
    </div>
    <button class="btn btn-block" onclick="nav('browse')">Back to browse</button>` : ''}
  `;
}

async function approveAndPay(){
  await safe(async ()=>{
    await api('/bookings/'+state.booking.id+'/approve', { method:'POST' });

async function openChat(id){

async function loadMessages(){

  return data.messages || [];
}

function screenChat(){
  const b = state.booking;
  const me = state.currentUser;
  const other = state.chatBooking && state.chatBooking.other ? state.chatBooking.other : partyLabel();
  return `
    <div class="back" onclick="nav('booking-detail')">&larr; ${other}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <h1 style="font-size:22px;">${partyLabel()}</h1>${pill(b.status)}
    </div>
    <div class="notice locked">🔒 Phone, email and WhatsApp/Telegram handles are always filtered here — keep everything in the app.</div>

      <input id="chat-input" type="text" placeholder="Write a message…" style="flex:1;" onkeydown="if(event.key==='Enter')sendMessage()">

async function renderChat(){
  const box = document.getElementById('chat-thread');
  if(!box) return;
  const me = state.currentUser;
  const msgs = await loadMessages();
  box.innerHTML = msgs.length
    ? msgs.map(m=>`<div class="bubble ${m.sender_id===me.id?'me':'them'}">${esc(m.body)}${m.filtered?` <span style="font-size:9px;color:var(--amber);">(contact filtered)</span>`:''}</div>`).join('')
    : `<div class="sub">No messages yet.</div>`;
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById('chat-input');
  const body = (input && input.value || '').trim();
  if(!body) return;
  await safe(async ()=>{
    const res = await api('/bookings/'+state.booking.id+'/messages', { method:'POST', body: JSON.stringify({ body }) });
    input.value = '';
    if(res.filtered) toast('Direct contact details (phone/email/handles) filtered');
    renderChat();
  });
}

function screenBookingDetail(){
  const b = state.booking;
  if(!b) return `<div class="sub">Loading…</div>`;
  const other = counterparty() || 'Deal';
  const meRole = isBusiness() ? 'business' : 'creator';
  const unlocked = ['identity_unlocked','delivered','approved','paid_out'].includes(b.status);
  const bubbles = (b.offers||[]).map(r=>{
    const mine = r.offered_by===meRole;
    return `<div class="bubble ${mine?'me':'them'}">${mine?'You':esc(other)} ${r.round===1?'offered':'countered'} ${fmtINR(r.price)} &middot; ${r.timeline_days}d</div>`;
  }).join('');
  let actions = '';
  const s = b.status;
  if(s==='negotiating'){
    actions = `
      <div class="field"><label>Counter price</label><input id="neg-price" type="text" value="${b.agreed_price-500}"></div>
      <div class="field"><label>Counter timeline (days)</label><input id="neg-days" type="text" value="7"></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" style="flex:1;" onclick="acceptOffer()">Accept ${fmtINR(b.agreed_price)}</button>
        <button class="btn" style="flex:1;" onclick="counterOffer()">Counter</button>
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="withdrawRequest()">Withdraw</button>`;
  } else if(s==='confirmed'){
    actions = isBusiness()
      ? `<button class="btn btn-primary btn-block" onclick="payEscrow()">Pay ${fmtINR(b.agreed_price)} into escrow</button>`
      : `<div class="notice">Waiting for the business to fund escrow.</div>`;
  } else if(s==='identity_unlocked'){
    actions = isCreator()
      ? `<div class="field"><label>Deliverable file URL</label><input id="dl-url" type="text" placeholder="https://.../final.mp4"></div><button class="btn btn-primary btn-block" onclick="uploadDeliverable()">Upload deliverable</button>`
      : `<div class="notice">Waiting for the creator to upload content.</div>`;
  } else if(s==='delivered'){
    actions = isBusiness()
      ? `<button class="btn btn-primary btn-block" onclick="approveAndPay()">Approve and release payout</button>`
      : `<div class="notice unlocked">✓ Delivered — waiting for approval and payout.</div>`;
  } else if(s==='paid_out'){
    actions = `<div class="notice unlocked">✓ Deal complete. Payout released.</div>
      <div class="field" style="margin-top:10px;"><label>Rate ${isBusiness()?'creator':'business'}</label>
        <div style="display:flex;gap:6px;margin-bottom:8px;">${[1,2,3,4,5].map(n=>`<span style="cursor:pointer;font-size:22px;color:var(--amber);" onclick="rate(${n})">${n<=(state.ratingGiven||0)?'★':'☆'}</span>`).join('')}</div>
      </div>`;
  } else {
    actions = `<div class="notice">This booking is ${pill(s)}.</div>`;
  }
  return `
    <div class="back" onclick="switchTab('bookings-tab')">&larr; all bookings</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <h1 style="font-size:24px;">${partyLabel()}</h1>${pill(s)}
    </div>
    <div class="sub">${esc(b.deliverable || 'Booking')}</div>
    <div class="panel">
      <div class="panel-row"><span>Agreed price</span><b>${fmtINR(b.agreed_price)}</b></div>
      <div class="panel-row"><span>Delivery by</span><b>${esc(b.deadline)} days</b></div>
      <div class="panel-row"><span>Escrow held</span><b>${unlocked?fmtINR(b.agreed_price):'—'}</b></div>
    </div>
    <h2 style="font-size:15px;font-family:var(--sans);font-weight:600;margin-bottom:8px;">Negotiation</h2>
    <div class="thread">${bubbles || `<div class="sub">No offers yet.</div>`}</div>
    <div style="display:flex;gap:10px;margin-bottom:14px;">
      <button class="btn" style="flex:1;" onclick="openChat('${b.id}')">Chat</button>
      <button class="btn" style="flex:1;" onclick="revealContact()">Verified identity</button>
    </div>
    <div id="contact-box"></div>
    ${actions}
  `;
}

function screenAccountTab(){
  const u = state.currentUser || {};
  let profileEdit = '';
  if(isCreator()){
    profileEdit = `
      <h2 style="font-size:15px;font-family:var(--sans);font-weight:600;margin:16px 0 8px;">Creator profile</h2>
      <div class="field"><label>Niche</label><input id="ap-niche" type="text" value="${esc((state.myProfile&&state.myProfile.niche)||'')}"></div>
      <div class="field"><label>Avg reach</label><input id="ap-reach" type="text" value="${(state.myProfile&&state.myProfile.avg_reach)||''}"></div>
      <div class="field"><label>Engagement rate (%)</label><input id="ap-eng" type="text" value="${(state.myProfile&&state.myProfile.engagement_rate)||''}"></div>
      <div class="field"><label>Portfolio URLs (comma separated)</label><input id="ap-port" type="text" value="${esc((state.myProfile&&state.myProfile.portfolio_urls||[]).join(', '))}"></div>
      <div class="field"><label>Verified social handle</label><input id="ap-handle" type="text" placeholder="@yourhandle" value="${esc((u.social_handle)||'')}"></div>
      <div class="field"><label>Verified account URL</label><input id="ap-verified-url" type="text" placeholder="https://instagram.com/yourhandle" value="${esc((u.verified_account_url)||'')}"></div>
      <div class="notice" style="margin-bottom:10px;">Your real name and handle reveal to a business the moment they request a booking. Direct contacts stay private.</div>
      <button class="btn btn-primary btn-block" onclick="saveCreatorProfile()">Save profile</button>`;
  } else {
    profileEdit = `
      <h2 style="font-size:15px;font-family:var(--sans);font-weight:600;margin:16px 0 8px;">Business profile</h2>
      <div class="field"><label>Public display name (shown on reveal)</label><input id="bp-name" type="text" value="${esc(u.public_name||'')}"></div>
      <div class="field"><label>Industry</label><input id="bp-industry" type="text"></div>
      <div class="field"><label>Budget range</label><input id="bp-budget" type="text"></div>
      <div class="field"><label>GST number</label><input id="bp-gst" type="text"></div>
      <button class="btn btn-primary btn-block" onclick="saveBusinessProfile()">Save profile</button>`;
  }
  return `
    <div class="eyebrow">Account</div>
    <h1 style="font-size:22px;">${esc(u.anon_id||'')}</h1>
    <div class="sub">${u.role==='creator'?'Creator':'Business'} &middot; tier ${esc(u.tier)}</div>
    <div class="verify-item"><div class="verify-dot ${u.email_verified?'done':''}">${u.email_verified?'✓':''}</div><div class="verify-text"><div class="t">Email verified</div></div></div>
    <div class="verify-item"><div class="verify-dot">—</div><div class="verify-text"><div class="t">Phone (optional, not verified)</div></div></div>
    ${profileEdit}
    <button class="btn btn-block" style="margin-top:20px;" onclick="logout()">Log out</button>
  `;
}

async function loadMyProfile(){
  if(!isCreator()) return;
  await safe(async ()=>{
    const data = await api('/creators/'+encodeURIComponent(state.currentUser.anon_id));
    state.myProfile = data;
  });
}
async function saveCreatorProfile(){
  const niche = document.getElementById('ap-niche').value;
  const avg_reach = parseInt(document.getElementById('ap-reach').value)||0;
  const engagement_rate = parseFloat(document.getElementById('ap-eng').value)||0;
  const port = (document.getElementById('ap-port').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const social_handle = document.getElementById('ap-handle').value.trim();
  const verified_account_url = document.getElementById('ap-verified-url').value.trim();
  await safe(async ()=>{
    await api('/creators/me', { method:'PATCH', body: JSON.stringify({ niche, avg_reach, engagement_rate, portfolio_urls: port, social_handle, verified_account_url }) });
    toast('Profile saved');
    await loadMe();
    await loadMyProfile();
    loadCreators();
  });
}
async function saveBusinessProfile(){
  const public_name = document.getElementById('bp-name').value.trim();
  const industry = document.getElementById('bp-industry').value;
  const budget_range = document.getElementById('bp-budget').value;
  const gst_number = document.getElementById('bp-gst').value;
  await safe(async ()=>{
    await api('/businesses/me', { method:'PATCH', body: JSON.stringify({ public_name, industry, budget_range, gst_number }) });
    toast('Profile saved');
    await loadMe();
  });
}
async function loadMe(){
  await safe(async ()=>{
    const me = await api('/auth/me');
    state.currentUser = me.user;
  });
}

/* ===================== RENDER ===================== */
function render(){
  if(['request','escrow'].includes(state.screen) && !isBusiness()) state.screen = 'bookings-tab';
  if(['request','negotiate','escrow','deliver','payout','booking-detail','chat'].includes(state.screen) && !state.booking) state.screen = 'bookings-tab';
  const el = document.getElementById('app');
  let body = '';
  switch(state.screen){
    case 'splash': body = screenSplash(); break;
    case 'signup': body = screenSignup(); break;
    case 'login': body = screenLogin(); break;
    case 'otp': body = screenOtp(); break;
    case 'verify': body = screenVerify(); break;
    case 'browse': body = screenBrowse(); break;
    case 'profile': body = screenProfile(); break;
    case 'request': body = screenRequest(); break;
    case 'negotiate': body = screenNegotiate(); break;
    case 'escrow': body = screenEscrow(); break;
    case 'deliver': body = screenDeliver(); break;
    case 'payout': body = screenPayout(); break;
    case 'booking-detail': body = screenBookingDetail(); break;
    case 'chat': body = screenChat(); break;
    case 'bookings-tab': body = screenBookingsTab(); break;
    case 'messages-tab': body = screenMessagesTab(); break;
    case 'account-tab': body = screenAccountTab(); break;
  }

  const isAuth = AUTH_SCREENS.includes(state.screen);
  const stepIdx = (isBusiness() && ['browse','profile','request','negotiate','escrow','deliver','payout'].includes(state.screen)) ? stepIndexForScreen(state.screen) : -1;
  const activeTab = ['browse','profile','request','negotiate','escrow','deliver','payout'].includes(state.screen) ? 'browse'
    : (['booking-detail','chat'].includes(state.screen) ? 'bookings-tab' : state.screen);

  const navBar = isAuth ? '' : `
    <div class="bottom-nav">
      ${NAV_ITEMS.map(n=>`<div class="nav-item ${activeTab===n.id?'active':''}" onclick="switchTab('${n.id}')"><span class="ico">${n.ico}</span>${n.label}</div>`).join('')}
    </div>`;

  el.innerHTML = `
    <div id="shell-outer">
      <div id="phone">
        <div id="phone-notch"></div>
        <div id="phone-screen">
          ${isAuth ? '' : `
            <div class="topbar" style="margin-bottom:14px;padding:6px 0 14px;">
              <div class="logo" onclick="switchTab('browse')"><div class="logo-mark" style="width:22px;height:22px;"></div><div class="logo-text" style="font-size:16px;">Younic</div></div>
              <div class="role-pill active" style="font-size:10px;">${(state.currentUser||{}).anon_id || state.authRole}</div>
            </div>
            ${stepIdx>=0 ? renderStepper() : ''}
          `}
          ${body}
          ${navBar}
        </div>
      </div>
    </div>
  `;
}

function switchTab(tab){
  if(tab==='browse'){ nav('browse'); loadCreators(); }
  else if(tab==='bookings-tab'){ nav('bookings-tab'); loadMyBookings(); }
  else if(tab==='messages-tab'){ nav('messages-tab'); loadMyBookings(); }
  else if(tab==='account-tab'){ nav('account-tab'); loadMyProfile(); }
  else nav(tab);
}
function logout(){
  setToken(null);
  state.currentUser = null; state.booking = null; state.selectedCreator = null;
  state.bookingsList = []; state.chatBooking = null; state.myProfile = null;
  nav('splash');
}

/* boot */
if(AUTH_TOKEN){
  safe(async ()=>{
    const me = await api('/auth/me');
    state.currentUser = me.user;
    state.authRole = me.user.role;
    loadCreators();
    loadMyBookings();
  });
}
render();
</script>
</body>
</html>
